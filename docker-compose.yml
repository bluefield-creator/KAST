services:
  kast:
    build: .
    container_name: kast
    # Port 5000 is intentionally NOT published: nginx is the sole entrypoint.
    expose:
      - "5000"
    ports:
      - "2302-2322:2302-2322/udp"    # Arma 3 game + Steam query ports
      - "2302-2322:2302-2322/tcp"    # BattlEye RCON (TCP)
    volumes:
      - kast-data:/app/data
      - kast-mods:/app/mods
      - kast-servers:/app/servers
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Data Source=/app/data/kast.db
      # Keep cookies and the Steam login on the persisted volume so container
      # recreates do not invalidate sessions or force a Steam re-login.
      - Kast__DataDirectory=/app/data
      - Kast__DataProtectionKeysDirectory=/app/data/keys
      # nginx reaches the app from the compose bridge network; trust it so the
      # per-IP rate limiters see real client addresses.
      - ForwardedHeaders__KnownNetworks__0=172.16.0.0/12
      - Telemetry__Enabled=true
      - Telemetry__OtlpEndpoint=http://jaeger:4317
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: kast-jaeger
    ports:
      # Loopback-only: traces include full SQL and the UI has no authentication.
      # Change to "16686:16686" only behind a firewall or authenticated proxy.
      - "127.0.0.1:16686:16686"   # Web UI
    # OTLP (4317) stays internal to the compose network — kast reaches it by
    # service name; nothing outside needs it.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kast-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      kast:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kast-data:
  kast-mods:
  kast-servers:
