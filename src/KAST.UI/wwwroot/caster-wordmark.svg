<svg viewBox="0 0 310 84" xmlns="http://www.w3.org/2000/svg" width="620" height="168" role="img">
  <title>CASTER</title>
  <!-- One mark: the kepi-C (same geometry as favicon.svg — keep in sync)
       with serif ASTER in the blonde hair gradient, all resting on the
       staff: a dark shaft with brass collars and the lilac ribbon — the
       one unissued color — knotted below the letters. Flat cel, no gloss. -->
  <defs>
    <style>@font-face{font-family:'CinzelEmb';src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal;}</style>
    <linearGradient id="wm-hair" x1="0" y1="20" x2="0" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFF3D9"/>
      <stop offset="45%"  stop-color="#F5D8A8"/>
      <stop offset="78%"  stop-color="#FBC9A0"/>
      <stop offset="100%" stop-color="#DDA389"/>
    </linearGradient>
    <linearGradient id="wm-crown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3B3A86"/>
      <stop offset="100%" stop-color="#24225E"/>
    </linearGradient>
  </defs>

  <!-- ═ The C: her hair bearing the kepi (favicon geometry, scaled) ═ -->
  <g transform="translate(1 8) scale(2.05)">
    <path d="M 23.2 25.6 A 9.7 9.7 0 1 1 23.2 12.4"
          fill="none" stroke="url(#wm-hair)" stroke-width="5.4" stroke-linecap="round"/>
    <g transform="translate(22.8 19.2)" fill="#C89A5E">
      <path d="M 0 -3.1 L 0.85 -0.85 L 3.1 0 L 0.85 0.85 L 0 3.1 L -0.85 0.85 L -3.1 0 L -0.85 -0.85 Z"/>
    </g>
    <g transform="rotate(-9 14 7)">
      <path d="M 7.4 3.4 L 20.6 3.4 L 21.4 8.2 L 6.6 8.2 Z" fill="url(#wm-crown)"/>
      <ellipse cx="14" cy="3.4" rx="6.95" ry="1.75" fill="#5A57A8"/>
      <path d="M 6.72 8.2 L 21.28 8.2 L 21.38 8.85 L 6.62 8.85 Z" fill="#EBCB95"/>
      <path d="M 6.62 8.85 L 21.38 8.85 L 21.56 10.55 L 6.44 10.55 Z" fill="#C8203C"/>
      <path d="M 6.44 10.55 L 21.56 10.55 L 21.63 11.2 L 6.37 11.2 Z" fill="#EBCB95"/>
      <g transform="translate(10.1 6.1) scale(0.52)" fill="#C89A5E">
        <path d="M 0.7 -0.7 L 5.4 -4.4 L 1.7 0.2 Z"/>
        <path d="M -0.4 -0.5 L -3.6 -1.7 L -0.9 0.6 Z"/>
        <path d="M 0.1 0.9 L -0.9 4.2 L 1 1.1 Z"/>
        <circle cx="0.2" cy="0" r="1.2"/>
      </g>
    </g>
    <path d="M 20.2 2.9 C 21.6 0.4 24.6 0.5 25.2 2.3 C 23.6 1.5 22.2 2 21.1 3.7 Z" fill="#F5D8A8"/>
  </g>

  <!-- ═ ASTER — serif, her hair (web fonts don't load in SVG-in-img,
       so Georgia/Times carry the serif when Cormorant is absent) ═ -->
  <text x="70" y="62" font-family="'CinzelEmb','Cinzel','Palatino Linotype',Georgia,serif" font-size="42" font-weight="700" letter-spacing="3.5" fill="url(#wm-hair)">ASTER</text>

  <!-- ═ The staff: dark shaft, brass collars, and the lilac ribbon ═ -->
  <path d="M 66 75 L 296 68.5" fill="none" stroke="#35343F" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="70"  cy="74.85" r="1.6" fill="#C89A5E"/>
  <circle cx="296" cy="68.5"  r="2.3" fill="#C89A5E"/>
  <circle cx="288" cy="68.85" r="1.3" fill="#C89A5E"/>
  <!-- the ribbon, knotted below the letters, tails streaming -->
  <circle cx="97" cy="74" r="1.9" fill="#DDA8D6"/>
  <path d="M 96.5 74.5 C 91 78.5 86 80 80.5 79.6" fill="none" stroke="#DDA8D6" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M 97.5 75 C 96 79 92.5 82 88 82.8" fill="none" stroke="#DDA8D6" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Starlight accents -->
  <g fill="#EAE9FA">
    <circle cx="112" cy="13" r="1.4"/>
    <circle cx="224" cy="10" r="1.1"/>
    <circle cx="263" cy="21" r="1.6"/>
  </g>
  <g transform="translate(196 13)" fill="#ffffff" opacity="0.9">
    <path d="M 0 -3 L 0.8 -0.8 L 3 0 L 0.8 0.8 L 0 3 L -0.8 0.8 L -3 0 L -0.8 -0.8 Z"/>
  </g>
</svg>
