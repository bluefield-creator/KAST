<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" width="512" height="512" role="img">
  <title>CASTER</title>
  <!-- The C alone: her hair bearing the kepi.
       Doctrine (docs/DESIGN.md): blonde gradient = lettering only; kepi =
       flat violet-indigo crown, crimson band between two cream pinstripes,
       gold crest at the wearer's left, no visor; one brass staff-light;
       the ahoge escapes under the kepi's front edge. Flat cel, no gloss. -->
  <defs>
    <linearGradient id="fc-hair" x1="0" y1="9" x2="0" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFF3D9"/>
      <stop offset="45%"  stop-color="#F5D8A8"/>
      <stop offset="78%"  stop-color="#FBC9A0"/>
      <stop offset="100%" stop-color="#DDA389"/>
    </linearGradient>
    <linearGradient id="fc-crown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3B3A86"/>
      <stop offset="100%" stop-color="#24225E"/>
    </linearGradient>
  </defs>

  <!-- The C — crown-gold into apricot, opening right -->
  <path d="M 23.2 25.6 A 9.7 9.7 0 1 1 23.2 12.4"
        fill="none" stroke="url(#fc-hair)" stroke-width="5.4" stroke-linecap="round"/>

  <!-- The staff-light: one brass star in the opening -->
  <g transform="translate(22.8 19.2)" fill="#C89A5E">
    <path d="M 0 -3.1 L 0.85 -0.85 L 3.1 0 L 0.85 0.85 L 0 3.1 L -0.85 0.85 L -3.1 0 L -0.85 -0.85 Z"/>
  </g>

  <!-- The kepi -->
  <g transform="rotate(-9 14 7)">
    <path d="M 7.4 3.4 L 20.6 3.4 L 21.4 8.2 L 6.6 8.2 Z" fill="url(#fc-crown)"/>
    <ellipse cx="14" cy="3.4" rx="6.95" ry="1.75" fill="#5A57A8"/>
    <path d="M 6.72 8.2 L 21.28 8.2 L 21.38 8.85 L 6.62 8.85 Z" fill="#EBCB95"/>
    <path d="M 6.62 8.85 L 21.38 8.85 L 21.56 10.55 L 6.44 10.55 Z" fill="#C8203C"/>
    <path d="M 6.44 10.55 L 21.56 10.55 L 21.63 11.2 L 6.37 11.2 Z" fill="#EBCB95"/>
    <!-- crest: asymmetric radiant, one long spike up-right, lobed center -->
    <g transform="translate(10.1 6.1) scale(0.52)" fill="#C89A5E">
      <path d="M 0.7 -0.7 L 5.4 -4.4 L 1.7 0.2 Z"/>
      <path d="M -0.4 -0.5 L -3.6 -1.7 L -0.9 0.6 Z"/>
      <path d="M 0.1 0.9 L -0.9 4.2 L 1 1.1 Z"/>
      <circle cx="0.2" cy="0" r="1.2"/>
    </g>
  </g>

  <!-- The ahoge, escaping the front edge -->
  <path d="M 20.2 2.9 C 21.6 0.4 24.6 0.5 25.2 2.3 C 23.6 1.5 22.2 2 21.1 3.7 Z" fill="#F5D8A8"/>
</svg>
